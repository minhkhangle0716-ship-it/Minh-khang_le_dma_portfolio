<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contacts - Minh-khang Le</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">

  <!-- âœ… FAVICON -->
  <link rel="icon" type="image/png" href="water_favicon.jpg">  <style>
    body {
      color: #e6e6e6;
      background-color: #1a3238;
      font-family: 'Raleway', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      background-color: #050316;
      border-bottom: 1px solid #222;
      padding: 20px 0;
      position: relative;
      z-index: 2;
    }

    .navbar ul {
      margin: 0;
      padding: 0;
    }

    .navbar ul li {
      list-style: none;
      display: inline-block;
      padding-right: 20px;
      font-weight: 600;
    }

    .nav-name {
      font-size: 1.2em;
      color: #57d5d9;
    }

    .navbar-link {
      color: #57d5d9;
      text-decoration: none;
      transition: color 0.3s;
    }

    .navbar-link:hover {
      color: #9ee2ff;
    }

    .navbar-link.current {
      color: #ff8c42;
      font-weight: 700;
    }

    /* Sections */
    .section {
      padding-top: 40px;
      padding-bottom: 60px;
    }

    .section h5 {
      color: #57d5d9;
      margin-bottom: 20px;
    }

    /* Contact Box */
    .contact-box {
      background-color: #161616;
      padding: 30px;
      border-left: 3px solid #57d5d9;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.8;
      border-radius: 6px;
    }

    .contact-box a {
      color: #9ee2ff;
      text-decoration: none;
    }

    .contact-box a:hover {
      text-decoration: underline;
    }

    /* Side bubble columns */
    .bubble-column {
      position: fixed;
      top: 0;
      width: 50px;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bubble-column.left { left: 0; }
    .bubble-column.right { right: 0; }

    .bubble-column-bubble {
      position: absolute;
      bottom: -20px;
      background-color: rgba(94, 202, 230, 0.4);
      border-radius: 50%;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    .navbar .bubble {
      position: absolute;
      bottom: 0;
      background-color: rgba(94, 202, 230, 0.4);
      border-radius: 50%;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container nav_pad">  
    <ul>
      <li class="nav-name">Minh-khang Le</li>
      <li><a class="navbar-link" href="index.html">Home</a></li>
      <li><a class="navbar-link" href="p1.html">Portfolio</a></li>
      <li><a class="navbar-link current" href="p2.html">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Side Bubbles -->
<div class="bubble-column left"></div>
<div class="bubble-column right"></div>

<!-- MAIN CONTAINER -->
<div class="container">

  <div class="row section">
    <div class="twelve columns">
      <h5>Contact</h5>

      <div class="contact-box">
        <p><strong>Email:</strong> <a href="mailto:Minhkhangle0716@gmail.com">Minhkhangle0716@gmail.com</a></p>
        <p><strong>Socials:</strong> 
          <a href="https://www.instagram.com/thecrunchywater/" target="_blank">Instagram</a> | 
          <a href="https://www.artstation.com/thecrunchywater" target="_blank">ArtStation</a>
        </p>
        <p>Reach out for collaborations, commissions, or questions!</p>
      </div>

    </div>
  </div>

</div>

<!-- Bubbles Script -->
<script>
window.addEventListener('load', () => {

  // Navbar bubbles
  const navbar = document.querySelector('.navbar');
  for(let i=0; i<20; i++){
    const b = document.createElement('span');
    b.className = 'bubble';
    b.style.left = Math.random()*100 + '%';
    b.style.width = (6 + Math.random()*10) + 'px';
    b.style.height = b.style.width;
    b.style.animationDuration = (5 + Math.random()*6) + 's';
    b.style.opacity = 0.4 + Math.random()*0.3;
    navbar.appendChild(b);
  }

  // Side bubbles
  function createSideBubbles(selector, count){
    const col = document.querySelector(selector);
    for(let i=0;i<count;i++){
      const b = document.createElement('span');
      b.className = 'bubble-column-bubble';
      b.style.left = Math.random()*30 + 'px';
      b.style.width = (6 + Math.random()*12) + 'px';
      b.style.height = b.style.width;
      b.style.animationDuration = (6 + Math.random()*10) + 's';
      b.style.opacity = 0.3 + Math.random()*0.3;
      b.style.animationDelay = Math.random()*10 + 's';
      col.appendChild(b);
    }
  }

  createSideBubbles('.bubble-column.left', 30);
  createSideBubbles('.bubble-column.right', 30);

});
</script>

</body>
</html>
